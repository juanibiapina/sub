name: Rust

on: [push]

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
    - name: Run linter
      run: make lint
    - name: Run tests
      run: make integration
